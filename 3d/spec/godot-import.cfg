# =============================================================
# Godot 4.6 glTF 导入预设（启航路 3D 版）
# -------------------------------------------------------------
# 这是**唯一权威口径**：Godot 导入面板里怎么勾，以本文件为准。
# 3d/tools/check-godot-import.cjs 拿 .glb.import 的 [params] 跟这里比对。
#
# 键名不是猜的：由 `3d/preview/assets/import-probe/probe-cube.glb`
# 经 Godot 4.6 stable 无头导入实测生成，见同目录 .glb.import。
# 2026-11-05 实测 GI 枚举：DISABLED=0 / STATIC=1 / DYNAMIC=2，
# 引擎默认 light_baking=1（Static），我们改成 0。
#
# 使用方法：
#   1. 编辑器 → 文件系统选中 .glb → 导入面板按下面的值设置 → 重新导入；
#   2. 或跑 `npm run 3d:import:check`，它只报告差异，不写文件。
#
# 注意：.glb.import 里的 uid / [deps] / [remap] 是机器生成项，
#       不在本预设里，校验脚本也只核对下面列出的 key。
# =============================================================

[params]
# ---- 根节点 ----
# 缩放必须是 1：blender-export.py 已经把变换应用掉了，再缩一次就是双重缩放。
nodes/root_type=""
nodes/root_name=""
nodes/root_script=null
nodes/apply_root_scale=true
nodes/root_scale=1.0
nodes/import_as_skeleton_bones=false
nodes/use_name_suffixes=true
nodes/use_node_type_suffixes=true

# ---- 网格 ----
meshes/ensure_tangents=true
meshes/generate_lods=true
meshes/create_shadow_meshes=true
# 0 = Disabled（实时灯 + 已有烘焙贴图，不做引擎内 lightmap）。
# 引擎默认 1 = Static Lightmaps；改成 1 会在导入时生成 UV2 并改变光照行为。
# 若哪天要开烘焙，必须同步改 3d/spec/conventions.md §4 和本行。
meshes/light_baking=0
meshes/lightmap_texel_size=0.2
meshes/force_disable_compression=false

# ---- 蒙皮 / 动画 ----
skins/use_named_skins=true
animation/import=true
animation/fps=30
animation/trimming=false
animation/remove_immutable_tracks=true
animation/import_rest_as_RESET=false

# ---- 导入脚本 ----
# 留空：正式资产若需要后处理，按每个资产单独挂 EditorScenePostImport 脚本。
import_script/path=""

# ---- 材质 / 贴图 ----
# extract=0 表示不把材质拆成外部文件；贴图打进 GLB（blender-export.py
# 的 export_materials='EXPORT'），换机器不会丢。
materials/extract=0
materials/extract_format=0
materials/extract_path=""
_subresources={}

# ---- glTF ----
gltf/naming_version=2
# 1 = Extract Textures（Godot 4.6 默认）。0=丢弃 / 2=嵌入 BasisU / 3=嵌入未压缩。
# 保持 1：把内嵌贴图抽出来交给 Godot 的图片导入器，后续才能单独压 VRAM。
gltf/embedded_image_handling=1

# ---- 碰撞：不是全局导入项 ----
# Godot 4.6 里碰撞体在「高级导入设置 → 场景 → 生成 > 物理」按节点勾选，
# 或导入完成后在场景里挂 StaticBody3D + CollisionShape3D。
# 清单 assets.manifest.json 的 collision 字段是**这里的施工依据**：
#   none  → 不建碰撞；box / convex → 简化形状；mesh → Trimesh（仅静态体）。
# 墙体必须是实体几何（有厚度 / 高度 / 门洞），碰撞形状不能替代可见几何。
