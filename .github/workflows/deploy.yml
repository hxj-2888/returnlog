# =============================================================
# returnlog · CI/CD（仓库由 space-kill-web 改名后重建，2026-11-06）
# -------------------------------------------------------------
# 设计原则：仓库名 / Cloudflare Pages 项目名 / 国内镜像域名都不写死。
#   - Pages 项目名来自仓库变量 vars.CF_PAGES_PROJECT（本次应为 returnlog）
#   - 凭据来自 secrets.CF_API_TOKEN / secrets.CF_ACCOUNT_ID
#   - 变量或凭据缺失时只跑门禁、跳过部署，流水线保持绿而不是直接失败
#   - 部署一律走 tools/deploy-pages.cjs 白名单暂存，禁止整仓直推
# 触发：push 到 main / 手动 workflow_dispatch
# =============================================================
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: Syntax · schema · staging gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check (js + tools)
        run: |
          find js tools -type f \( -name '*.js' -o -name '*.cjs' \) -print0 \
            | xargs -0 -n1 node --check

      - name: Plate schema validation
        run: |
          if [ -f tools/plate/validate.cjs ]; then
            node tools/plate/validate.cjs
          else
            echo "::notice::tools/plate/validate.cjs 尚未入库，跳过 schema 校验"
          fi

      - name: Deploy whitelist staging (dry-run)
        run: |
          node tools/deploy-pages.cjs --dry-run | tee /tmp/stage.txt
          grep -q '^\[deploy\] 暂存 ' /tmp/stage.txt

  deploy:
    name: Cloudflare Pages
    needs: gate
    runs-on: ubuntu-latest
    env:
      CF_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check deploy config
        id: cfg
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_PROJECT" ] || [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ACCOUNT_ID" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置 vars.CF_PAGES_PROJECT 或 CF secrets，跳过 Pages 部署"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install wrangler
        if: steps.cfg.outputs.ready == 'true'
        run: npm install -g wrangler@4

      - name: Deploy (whitelist staging)
        if: steps.cfg.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: node tools/deploy-pages.cjs

      - name: Smoke test
        if: steps.cfg.outputs.ready == 'true'
        run: |
          curl -fsSL -o /dev/null --max-time 30 "https://${CF_PROJECT}.pages.dev/"
          curl -fsSL -o /dev/null --max-time 30 "https://${CF_PROJECT}.pages.dev/js/config/version.js"
