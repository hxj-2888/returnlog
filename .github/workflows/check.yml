name: check

# 2026-11-12：独立仓 returnlog-3d 已删除，3D 的唯一远端是老仓 returnlog.git 的
# 3d 副分支（AGENTS.md 红线 13）。本地 master 通过 remote.origin.push 映射到 3d，
# 所以这里触发分支改为 3d；只跑只读门禁，不发布任何网页。
# 主站 / 作品集的部署仍只由老仓 main 的 deploy.yml 负责，避免用 3d 分支的
# 2.5D 只读镜像覆盖线上版本。
on:
  push:
    branches: [3d]
  pull_request:
    branches: [3d]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Read-only gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # docs:sync / docs:check 需要「同级目录存在 2.5D 真源」。
      # 主仓是公开仓，匿名检出即可，不需要额外 token；
      # actions/checkout 不允许写到 workspace 外，所以先进 workspace 再软链成同级路径。
      - uses: actions/checkout@v4
        with:
          repository: hxj-2888/returnlog
          ref: main
          path: upstream-returnlog
      - name: Place 2.5D source as sibling directory
        run: ln -s "$GITHUB_WORKSPACE/upstream-returnlog" "$GITHUB_WORKSPACE/../新返航录"
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read-only gates
        run: npm run check

      - name: Shared docs sync check
        run: npm run docs:check

      - name: Baseline
        run: npm run baseline:check

      - name: Redline contract
        run: npm run agent:contract

      - name: Publish guard
        run: npm run guard
