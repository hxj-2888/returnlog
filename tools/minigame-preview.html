<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>新返航录 · 任务小游戏（高难 8 型 · 普通按舱室分类）</title>
<style>
  /* 令牌全部取自 js/ui/templates.js：面板 #12161E / 描边 #2A3240 / 正文 #DDE3EC /
     琥珀 #F0C674 / 告警 #FFB020 / 弱化 #8FA6C0 / 按钮 #1D2530 + #313B4B。
     字体、圆角、按钮内边距与主页一致，不另造一套。 */
  :root{
    --panel:#12161E; --panel2:#0D1117; --line:#2A3240; --line2:#313B4B;
    --ink:#DDE3EC; --muted:#8FA6C0; --amber:#F0C674; --warn:#FFB020;
    --btn:#1D2530; --bar:#222833; --tag:#4A5568; --bad:#7A2A2A;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:#0A0D13;color:var(--ink);
    font-family:system-ui,"Microsoft YaHei",sans-serif;
    display:flex;flex-direction:column;align-items:center;padding:18px 16px 10px
  }
  h1{margin:0 0 4px;font-size:15px;font-weight:600;letter-spacing:.04em;color:var(--amber)}
  .sub{margin:0 0 12px;font-size:12px;color:var(--muted)}
  .wrap{width:min(96vw,980px);display:flex;gap:10px;align-items:stretch}
  .side{width:238px;flex:0 0 238px;background:var(--panel);border:1px solid var(--line);
    border-radius:14px;padding:8px 7px;max-height:min(68vh,580px);overflow:auto}
  .room{font-size:10.5px;color:var(--muted);letter-spacing:.08em;padding:9px 7px 3px}
  .row{display:flex;align-items:center;gap:6px;padding:5px 7px;border-radius:7px;cursor:pointer;font-size:12.5px}
  .row:hover{background:rgba(240,198,116,.06)}
  .row[aria-current="true"]{background:rgba(240,198,116,.10);box-shadow:inset 0 0 0 1px rgba(240,198,116,.28)}
  .row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .tag{flex:0 0 auto;font-size:9.5px;padding:0 4px;border-radius:3px;border:1px solid var(--tag);color:var(--muted)}
  .row .tag.hard{color:var(--amber);border-color:#4A3C1E}
  .row .tm{flex:0 0 auto;font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}

  .cover{flex:1;min-width:0;background:#070A10;border:1px solid var(--line);border-radius:14px;
    position:relative;overflow:hidden;min-height:min(68vh,580px)}
  .world{position:absolute;inset:0;opacity:.5}
  .world i{position:absolute;border:1px solid rgba(0,229,176,.14);border-radius:6px}
  .panel{position:absolute;inset:3%;background:var(--panel);border:1px solid var(--line);
    border-radius:14px;display:flex;flex-direction:column;overflow:hidden}
  .ph{display:flex;align-items:center;justify-content:space-between;padding:9px 13px;border-bottom:1px solid var(--line)}
  .ph strong{font-size:13px;font-weight:600;color:var(--amber)}
  .ph span{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
  .bar{height:3px;background:var(--bar)}
  .bar i{display:block;height:100%;width:100%;background:var(--amber);transition:width .1s linear}
  .stage{flex:1;position:relative;padding:14px 16px;display:flex;flex-direction:column;justify-content:center;gap:10px;
    background-position:center;background-size:cover}
  .hint{font-size:11.5px;color:var(--muted);text-align:center;min-height:18px}
  .hint.bad{color:#E08A86}.hint.good{color:var(--amber)}
  .pf{display:flex;justify-content:space-between;align-items:center;padding:7px 13px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
  .pf button,.btn{background:var(--btn);color:var(--ink);border:1px solid var(--line2);border-radius:8px;
    padding:6px 12px;font-size:12px;font-family:inherit;cursor:pointer}
  .pf button:hover,.btn:hover{border-color:var(--amber);color:var(--amber)}
  .ok .panel{border-color:rgba(240,198,116,.55)}
  .bad .panel{border-color:var(--bad)}
  .center{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}

  .wire{position:relative;display:flex;justify-content:space-between;gap:12px;min-height:200px}
  .col{display:flex;flex-direction:column;justify-content:space-around;gap:10px}
  .port{width:48px;height:30px;border-radius:6px;border:1px solid var(--line2);background:var(--panel2);cursor:pointer;position:relative}
  .port::after{content:"";position:absolute;inset:7px 11px;border-radius:2px;background:currentColor}
  .port.sel{border-color:var(--amber);box-shadow:0 0 0 2px rgba(240,198,116,.2)}
  .port.done{opacity:.4;cursor:default}
  .port[data-c="t"]{color:#00E5B0}.port[data-c="a"]{color:var(--amber)}
  .port[data-c="r"]{color:#E0574F}.port[data-c="b"]{color:#73A7FF}
  .wire svg{position:absolute;inset:0;pointer-events:none}
  .wire svg path{fill:none;stroke-width:2;stroke-linecap:round;opacity:.8}

  .grid{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,48px);gap:7px}
  .slot{border:1px dashed #3A4454;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#5C6678;font-size:16px;cursor:pointer}
  .slot.filled{border-style:solid;border-color:#4A3C1E;background:rgba(240,198,116,.08);color:var(--amber)}
  .tray{display:flex;flex-direction:column;gap:7px}
  .blk{width:58px;height:32px;border-radius:7px;border:1px solid var(--line2);background:var(--panel2);color:var(--ink);font-size:15px;cursor:pointer}
  .blk.sel{border-color:var(--amber)}
  .blk.used{opacity:.25;cursor:default}

  .rail{width:22px;height:150px;border-radius:11px;background:var(--panel2);border:1px solid var(--line2);position:relative;overflow:hidden}
  .rail i{position:absolute;left:0;right:0;bottom:0;background:var(--amber);height:0%}
  .lever svg{width:132px;height:150px;overflow:visible}
  .lever .arm{transition:transform .06s linear;transform-origin:66px 124px}
  .lever .spark{opacity:0}.lever.fire .spark{opacity:1}

  .rows{display:flex;flex-direction:column;gap:14px}
  .rrow{display:flex;align-items:center;gap:10px}
  .rlab{width:54px;font-size:11px;color:var(--muted);flex:0 0 auto}
  .rtrack{position:relative;flex:1;height:26px;display:flex;align-items:center}
  .rtrack .band{position:absolute;top:4px;bottom:4px;background:rgba(240,198,116,.16);border:1px solid #4A3C1E;border-radius:4px}
  .rtrack .ln{position:absolute;left:0;right:0;height:2px;background:var(--bar)}
  .rtrack input[type=range]{position:relative;width:100%;margin:0;accent-color:#F0C674;background:transparent}

  .pourbin{display:flex;align-items:flex-end;gap:16px}
  .vessel{width:62px;height:166px;border:1px solid var(--line2);border-radius:6px;background:var(--panel2);position:relative;overflow:hidden}
  .vessel .fill{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,rgba(240,198,116,.75),rgba(240,198,116,.22));height:0}
  .vessel .zone{position:absolute;left:0;right:0;border-top:1px dashed rgba(240,198,116,.7);border-bottom:1px dashed rgba(240,198,116,.7);background:rgba(240,198,116,.07)}
  .ticks{font-size:10px;color:var(--muted);display:flex;flex-direction:column;justify-content:space-between;height:166px}

  .swap{display:flex;align-items:center;gap:18px}
  .socket{width:74px;height:96px;border:1px solid var(--line2);border-radius:8px;background:var(--panel2);display:flex;align-items:center;justify-content:center}
  .core{width:56px;height:78px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;color:#0A0D13;font-weight:600}
  .core.old{background:#6B7280}.core.c1{background:#00E5B0}.core.c2{background:#E0574F}.core.c3{background:#73A7FF}

  .board{position:relative;height:176px;border:1px solid var(--line);border-radius:8px;background:
    repeating-linear-gradient(0deg,transparent 0 23px,rgba(255,255,255,.04) 23px 24px),
    repeating-linear-gradient(90deg,transparent 0 23px,rgba(255,255,255,.04) 23px 24px)}
  .probe{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;
    border:2px solid var(--amber);background:rgba(240,198,116,.15);cursor:grab}
  .tgt{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;border:1px dashed rgba(0,229,176,.7)}

  .range{position:relative;height:116px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);overflow:hidden;cursor:crosshair}
  .range .zone{position:absolute;top:0;bottom:0;left:46%;width:8%;background:rgba(240,198,116,.16);border-left:1px solid #4A3C1E;border-right:1px solid #4A3C1E}
  .range .mk{position:absolute;top:0;bottom:0;width:2px;background:var(--amber);left:0}

  .cards{display:grid;grid-template-columns:repeat(4,62px);gap:8px;justify-content:center}
  .cd{height:62px;border:1px solid var(--line2);border-radius:8px;background:var(--panel2);cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-size:18px;color:#3B4658}
  .cd.up{color:var(--amber);border-color:#4A3C1E;background:rgba(240,198,116,.07)}
  .cd.done{color:#00E5B0;border-color:#1F5A49;background:rgba(0,229,176,.06);cursor:default}

  .shelf{position:relative;height:186px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);touch-action:none}
  .shelf .tline{position:absolute;left:0;right:0;border-top:1px dashed rgba(240,198,116,.55)}
  .lv{position:absolute;left:0;right:0;height:12px;background:#1B2432;border-top:2px solid var(--muted);cursor:ns-resize}
  .lv i{position:absolute;right:6px;top:-9px;font-size:9px;color:var(--muted);font-style:normal}
</style>
</head>
<body>
<h1>返 航 录 · 任务小游戏</h1>
<p class="sub">高难 8 个各占一型 · 普通 18 个按舱室与名称归类 · 中断或失败即重做</p>

<div class="wrap">
  <aside class="side" id="side"></aside>
  <div class="cover" id="cover">
    <div class="world">
      <i style="left:5%;top:14%;width:28%;height:34%"></i><i style="left:40%;top:8%;width:22%;height:24%"></i>
      <i style="left:68%;top:20%;width:26%;height:46%"></i><i style="left:16%;top:58%;width:38%;height:26%"></i>
    </div>
    <section class="panel" id="panel">
      <div class="ph"><strong id="title">选择左侧任务</strong><span id="clock">—</span></div>
      <div class="bar"><i id="prog"></i></div>
      <div class="stage" id="stage"><div class="hint">左侧 26 个任务点：高难 8 个各有独立玩法，普通 18 个按舱室与名称归类</div></div>
      <div class="pf"><span id="foot">—</span><button id="abort">中断（进度清零）</button></div>
    </section>
  </div>
</div>

<script>
(function(){
  'use strict';
  var side=document.getElementById('side'), stage=document.getElementById('stage'),
      title=document.getElementById('title'), clock=document.getElementById('clock'),
      prog=document.getElementById('prog'), foot=document.getElementById('foot'),
      panel=document.getElementById('panel');

  /* 26 个任务点 + 电闸。arch = 玩法原型：高难 8 个各占一个，普通按舱室归类复用。 */
  var TASKS=[
    {room:'引擎',   name:'引擎组同步',   kind:'hard',   dur:7,   arch:'sync'},
    {room:'引擎',   name:'零件台',       kind:'normal', dur:4,   arch:'place'},
    {room:'引擎',   name:'工具架',       kind:'normal', dur:5,   arch:'place'},
    {room:'引擎',   name:'备用配电盘',   kind:'normal', dur:6,   arch:'wire'},
    {room:'生态舱', name:'氧气循环',     kind:'hard',   dur:8,   arch:'pour'},
    {room:'生态舱', name:'培养罐补液',   kind:'normal', dur:4,   arch:'pour'},
    {room:'生态舱', name:'温控面板',     kind:'normal', dur:5,   arch:'sync'},
    {room:'配电室', name:'电路维修',     kind:'hard',   dur:10,  arch:'wire'},
    {room:'配电室', name:'变压器换芯',   kind:'hard',   dur:9,   arch:'swap'},
    {room:'食堂',   name:'餐台清洁',     kind:'normal', dur:6,   arch:'place'},
    {room:'食堂',   name:'后厨盘点',     kind:'normal', dur:4,   arch:'place'},
    {room:'娱乐室', name:'娱乐桌',       kind:'normal', dur:5,   arch:'match'},
    {room:'娱乐室', name:'点唱机',       kind:'normal', dur:6,   arch:'sync'},
    {room:'医疗间', name:'手术台校准',   kind:'hard',   dur:7,   arch:'align'},
    {room:'医疗间', name:'药柜',         kind:'normal', dur:4,   arch:'match'},
    {room:'医疗间', name:'消毒循环',     kind:'normal', dur:5,   arch:'pour'},
    {room:'军械库', name:'靶道校准',     kind:'hard',   dur:8,   arch:'aim'},
    {room:'军械库', name:'工作台',       kind:'normal', dur:6,   arch:'place'},
    {room:'军械库', name:'弹药清点',     kind:'normal', dur:4,   arch:'match'},
    {room:'监控室', name:'监控墙重连',   kind:'hard',   dur:9,   arch:'match'},
    {room:'监控室', name:'操作台',       kind:'normal', dur:5,   arch:'sync'},
    {room:'监控室', name:'录像归档',     kind:'normal', dur:6,   arch:'match'},
    {room:'仓库',   name:'货架校准',     kind:'hard',   dur:7,   arch:'level'},
    {room:'仓库',   name:'库存盘点',     kind:'normal', dur:4,   arch:'place'},
    {room:'仓库',   name:'货箱封条',     kind:'normal', dur:5,   arch:'place'},
    {room:'仓库',   name:'出库扫描',     kind:'normal', dur:6,   arch:'wire'},
    {room:'配电室', name:'电闸（拉/合）', kind:'hard',   dur:4.5, arch:'lever'}
  ];

  /* 底图：本地 Qwen-Image 2.1 Turbo（研究许可，仅内部评估）。换图只改这里。 */
  var ART={
    wire:'../assets/minigame/panel-fix.png', place:'../assets/minigame/panel-fix.png',
    sync:'../assets/minigame/panel-fix.png', pour:'../assets/minigame/panel-fix.png',
    align:'../assets/minigame/panel-fix.png', match:'../assets/minigame/panel-fix.png',
    level:'../assets/minigame/panel-fix.png', swap:'../assets/minigame/panel-breaker.png',
    aim:'../assets/minigame/panel-breaker.png', lever:'../assets/minigame/panel-breaker.png'
  };

  var cur=null, raf=0, anim=0, t0=0, done=false, limit=0;

  function el(tag,cls,txt){ var e=document.createElement(tag); if(cls)e.className=cls; if(txt!=null)e.textContent=txt; return e; }
  function rnd(n){ return Math.floor(Math.random()*n); }
  function shuffled(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){var j=rnd(i+1),t=a[i];a[i]=a[j];a[j]=t;} return a; }
  function stop(){ if(raf)cancelAnimationFrame(raf); if(anim)cancelAnimationFrame(anim); raf=0; anim=0; }

  function hint(txt,cls){
    var h=stage.querySelector('.hint');
    if(!h){ h=el('div','hint'); stage.appendChild(h); }
    h.textContent=txt; h.className='hint'+(cls?(' '+cls):'');
  }
  function settle(ok,msg){
    if(done)return; done=true; stop();
    panel.classList.add(ok?'ok':'bad');
    hint(msg, ok?'good':'bad');
    var b=el('button','btn', ok?'再来一次':'重做');
    b.style.marginTop='8px'; b.onclick=function(){ start(cur); };
    stage.appendChild(b);
  }
  var A={ ok:function(m){ settle(true,m); }, fail:function(m){ settle(false,m); }, hint:hint };

  function clearStage(){ stop(); stage.innerHTML=''; panel.classList.remove('ok','bad'); }

  function tick(){
    if(done||limit<=0)return;
    var used=(performance.now()-t0)/1000, left=limit-used;
    /* 没有限时：到点只是**保底**，自动算完成 */
    if(left<=0){ A.ok('保底时间到 · 任务自动完成'); return; }
    clock.textContent='保底 '+Math.ceil(left)+'s';
    prog.style.width=Math.min(100,used/limit*100).toFixed(1)+'%';
    raf=requestAnimationFrame(tick);
  }

  /* ---------------- 玩法原型 ---------------- */

  function gWire(){
    var cols=['t','a','r','b'], right=shuffled(cols);
    var box=el('div','wire'), svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('width','100%'); svg.setAttribute('height','100%');
    svg.setAttribute('style','position:absolute;inset:0;pointer-events:none');
    var lc=el('div','col'), rc=el('div','col'), sel=null, pairs=[];
    cols.forEach(function(c){
      var p=el('div','port'); p.dataset.c=c;
      p.onclick=function(){ if(done||p.classList.contains('done'))return;
        if(sel)sel.classList.remove('sel'); sel=p; p.classList.add('sel'); hint('已选左端，点右端同色'); };
      lc.appendChild(p);
    });
    right.forEach(function(c){
      var p=el('div','port'); p.dataset.c=c;
      p.onclick=function(){
        if(done||!sel||p.classList.contains('done'))return;
        if(p.dataset.c!==sel.dataset.c){
          pairs=[]; svg.innerHTML='';
          Array.prototype.forEach.call(box.querySelectorAll('.port'),function(x){x.classList.remove('done','sel')});
          sel=null; hint('颜色不对 → 整组重来','bad'); return;
        }
        var a=sel; a.classList.remove('sel'); a.classList.add('done'); p.classList.add('done');
        pairs.push([a,p]); sel=null; draw(); hint('接通 '+pairs.length+' / 4');
        if(pairs.length===4)A.ok('接线完成 · 任务成功');
      };
      rc.appendChild(p);
    });
    box.appendChild(lc); box.appendChild(rc); box.appendChild(svg); stage.appendChild(box);
    hint('左端 → 右端，颜色要一一对上','');
    function draw(){
      var bb=box.getBoundingClientRect(); svg.innerHTML='';
      pairs.forEach(function(pr){
        var X=pr[0].getBoundingClientRect(), Y=pr[1].getBoundingClientRect();
        var p=document.createElementNS('http://www.w3.org/2000/svg','path');
        p.setAttribute('d','M'+(X.right-bb.left)+' '+(X.top-bb.top+X.height/2)+
          ' C'+(X.right-bb.left+60)+' '+(X.top-bb.top+X.height/2)+','+
          (Y.left-bb.left-60)+' '+(Y.top-bb.top+Y.height/2)+','+(Y.left-bb.left)+' '+(Y.top-bb.top+Y.height/2));
        p.setAttribute('stroke','#F0C674'); p.setAttribute('vector-effect','non-scaling-stroke');
        svg.appendChild(p);
      });
    }
  }

  function gPlace(){
    var shapes=['▲','●','■','◆'], need=shuffled(shapes.slice(0,3)), slots=shuffled(need.concat([shapes[3]]));
    var box=el('div','center'), grid=el('div','grid'), tray=el('div','tray'), sel=null, placed=0;
    slots.forEach(function(s){
      var d=el('div','slot'); d.dataset.s=s;
      d.onclick=function(){
        if(done||!sel||d.classList.contains('filled'))return;
        if(d.dataset.s!==sel.dataset.s){
          Array.prototype.forEach.call(grid.children,function(x){x.classList.remove('filled');x.textContent=''});
          Array.prototype.forEach.call(tray.children,function(x){x.classList.remove('used')});
          placed=0; sel=null; hint('形状不符 → 整组重来','bad'); return;
        }
        d.classList.add('filled'); d.textContent=sel.dataset.s;
        sel.classList.add('used'); sel.classList.remove('sel'); sel=null; placed++;
        hint('已放置 '+placed+' / 3');
        if(placed===3)A.ok('放置完成 · 任务成功');
      };
      grid.appendChild(d);
    });
    shuffled(need).forEach(function(s){
      var b=el('button','blk',s); b.dataset.s=s;
      b.onclick=function(){ if(done||b.classList.contains('used'))return;
        if(sel)sel.classList.remove('sel'); sel=b; b.classList.add('sel'); hint('已选零件，点形状相符的槽位'); };
      tray.appendChild(b);
    });
    box.appendChild(grid); box.appendChild(tray); stage.appendChild(box);
    hint('零件 → 槽位，形状要对上','');
  }

  function gLever(){
    var box=el('div','center lever');
    var rail=el('div','rail'), fill=el('i'); rail.appendChild(fill);
    var svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('viewBox','0 0 132 150');
    svg.innerHTML='<rect x="26" y="122" width="80" height="12" rx="6" fill="#0D1117" stroke="#313B4B"/>'+
      '<g class="arm"><rect x="61" y="36" width="10" height="92" rx="5" fill="#1B2432" stroke="rgba(240,198,116,.5)"/>'+
      '<circle cx="66" cy="38" r="13" fill="#0D1117" stroke="#F0C674" stroke-width="2"/></g>'+
      '<g class="spark"><path d="M66 30 L58 48 L69 46 L61 64" fill="none" stroke="#FFB020" stroke-width="2.4" stroke-linecap="round"/>'+
      '<circle cx="66" cy="38" r="20" fill="none" stroke="#FFB020" stroke-opacity=".35" stroke-width="2"/></g>';
    var hold=el('button','btn','按住不放 · 拉到底');
    box.appendChild(rail); box.appendChild(svg); box.appendChild(hold); stage.appendChild(box);
    hint('按住不放直到充满；松早了整组重来','');
    var charge=0, held=false, last=0, fire=0, arm=svg.querySelector('.arm');
    hold.addEventListener('pointerdown',function(e){ e.preventDefault(); held=true; });
    hold.addEventListener('pointerup',function(){ held=false; });
    hold.addEventListener('pointercancel',function(){ held=false; });
    function loop(ts){
      if(done)return;
      if(!last)last=ts; var dt=Math.min(.05,(ts-last)/1000); last=ts;
      if(held&&charge<1)charge=Math.min(1,charge+dt/1.2);
      if(!held&&charge>0)charge=Math.max(0,charge-dt*2.4);
      fill.style.height=(charge*100).toFixed(0)+'%';
      arm.style.transform='rotate('+(-70*charge).toFixed(1)+'deg)';
      if(fire>0){fire-=dt;if(fire<=0)svg.classList.remove('fire');}
      if(charge>=1){ svg.classList.add('fire'); fire=.4; setTimeout(function(){ A.ok('电闸已到位 · 全船灯态改变'); },140); return; }
      anim=requestAnimationFrame(loop);
    }
    anim=requestAnimationFrame(loop);
  }

  function gSync(){
    var targets=[[18,32],[48,62],[34,50]], rows=el('div','rows'), inputs=[];
    for(var i=0;i<3;i++){
      var r=el('div','rrow'), lab=el('span','rlab','通道 '+(i+1));
      var tr=el('div','rtrack'), band=el('i','band'), ln=el('i','ln');
      band.style.left=targets[i][0]+'%'; band.style.width=(targets[i][1]-targets[i][0])+'%';
      tr.appendChild(ln); tr.appendChild(band);
      var inp=document.createElement('input'); inp.type='range'; inp.min='0'; inp.max='100';
      inp.value=String([12,74,26][i]); tr.appendChild(inp);
      inputs.push(inp); r.appendChild(lab); r.appendChild(tr); rows.appendChild(r);
    }
    stage.appendChild(rows); hint('把三条通道都调进亮带并保持 0.6 秒','');
    var hold=0,last=0;
    function loop(ts){
      if(done)return;
      if(!last)last=ts; var dt=Math.min(.05,(ts-last)/1000); last=ts;
      var all=inputs.every(function(inp,i){ var v=+inp.value; return v>=targets[i][0]&&v<=targets[i][1]; });
      hold=all?hold+dt:0;
      if(all)hint('保持 '+hold.toFixed(1)+' / 0.6 s','good');
      if(hold>=0.6){ A.ok('三条通道同步 · 任务成功'); return; }
      anim=requestAnimationFrame(loop);
    }
    anim=requestAnimationFrame(loop);
  }

  function gPour(){
    var box=el('div','center'), bin=el('div','pourbin');
    var vessel=el('div','vessel'), fill=el('i','fill'), zone=el('i','zone');
    var lo=52, hi=68; zone.style.bottom=lo+'%'; zone.style.height=(hi-lo)+'%';
    vessel.appendChild(fill); vessel.appendChild(zone);
    var ticks=el('div','ticks'); ['100','75','50','25','0'].forEach(function(t){ ticks.appendChild(el('span',null,t)); });
    var hold=el('button','btn','按住注液 · 松开确认');
    bin.appendChild(vessel); bin.appendChild(ticks); box.appendChild(bin); box.appendChild(hold);
    stage.appendChild(box); hint('注到亮带内再松手；溢出或不足都重来','');
    var v=0, held=false, last=0;
    hold.addEventListener('pointerdown',function(e){ e.preventDefault(); held=true; });
    hold.addEventListener('pointerup',function(){
      if(!held||done)return; held=false;
      if(v>hi)A.fail('注过头了 → 整组重来');
      else if(v<lo)A.fail('注得不够 → 整组重来');
      else A.ok('配比到位 · 任务成功');
    });
    function loop(ts){
      if(done)return;
      if(!last)last=ts; var dt=Math.min(.05,(ts-last)/1000); last=ts;
      if(held&&v<100)v=Math.min(100,v+dt*38);
      fill.style.height=v.toFixed(0)+'%';
      anim=requestAnimationFrame(loop);
    }
    anim=requestAnimationFrame(loop);
  }

  function gSwap(){
    var box=el('div','center swap'), sock=el('div','socket');
    var oldc=el('div','core old','旧芯'); sock.appendChild(oldc);
    var tray=el('div','tray'), colors=['c1','c2','c3'], target=colors[rnd(3)], removed=false;
    oldc.onclick=function(){ if(done||removed)return; removed=true; oldc.remove(); hint('旧芯已取出，选一枚同型号新芯'); };
    shuffled(colors).forEach(function(c){
      var b=el('button','core '+c, c==='c1'?'A 型':c==='c2'?'B 型':'C 型');
      b.style.width='58px'; b.style.height='34px'; b.style.border='1px solid #313B4B'; b.style.cursor='pointer';
      b.onclick=function(){
        if(done||!removed)return;
        if(c!==target){ A.fail('型号不对 → 整组重来'); return; }
        sock.appendChild(el('div','core '+c,'新芯')); A.ok('换芯完成 · 任务成功');
      };
      tray.appendChild(b);
    });
    box.appendChild(sock); box.appendChild(tray); stage.appendChild(box);
    hint('先取出旧芯，再插入同型号（'+(target==='c1'?'A':(target==='c2'?'B':'C'))+' 型）','');
  }

  function gAlign(){
    var board=el('div','board'), n=3, probes=[], tgts=[];
    for(var i=0;i<n;i++){
      var tx=16+rnd(62), ty=14+rnd(56);
      var t=el('div','tgt'); t.style.left=tx+'%'; t.style.top=ty+'%'; board.appendChild(t); tgts.push({x:tx,y:ty});
    }
    for(var j=0;j<n;j++){
      var p=el('div','probe'); p.style.left=(8+j*32)+'%'; p.style.top=(72-j*16)+'%';
      board.appendChild(p); probes.push(p);
    }
    stage.appendChild(board); hint('把三个探针拖到虚线靶心（误差 2.6%）','');
    var drag=null;
    function pos(e){ var bb=board.getBoundingClientRect(); return {x:(e.clientX-bb.left)/bb.width*100,y:(e.clientY-bb.top)/bb.height*100}; }
    board.addEventListener('pointerdown',function(e){
      var t=e.target; if(!t.classList.contains('probe'))return;
      drag=t; t.setPointerCapture(e.pointerId); e.preventDefault();
    });
    board.addEventListener('pointermove',function(e){
      if(!drag)return; var p=pos(e);
      drag.style.left=Math.max(0,Math.min(100,p.x))+'%'; drag.style.top=Math.max(0,Math.min(100,p.y))+'%';
      check();
    });
    board.addEventListener('pointerup',function(){ drag=null; });
    board.addEventListener('pointercancel',function(){ drag=null; });
    function check(){
      var okAll=probes.every(function(p,k){
        return Math.hypot(parseFloat(p.style.left)-tgts[k].x, parseFloat(p.style.top)-tgts[k].y)<2.6;
      });
      if(okAll)A.ok('三点评定通过 · 任务成功');
    }
  }

  function gAim(){
    var rng=el('div','range'), zone=el('div','zone'), mk=el('div','mk');
    rng.appendChild(zone); rng.appendChild(mk); stage.appendChild(rng);
    var hits=0, dir=1, x=0, last=0;
    hint('准星进入亮带时点击，连中 3 次','');
    function loop(ts){
      if(done)return;
      if(!last)last=ts; var dt=Math.min(.05,(ts-last)/1000); last=ts;
      x+=dir*dt*46; if(x>96){x=96;dir=-1;} if(x<0){x=0;dir=1;}
      mk.style.left=x+'%';
      anim=requestAnimationFrame(loop);
    }
    rng.onclick=function(){
      if(done)return;
      if(x>=46&&x<=54){ hits++; hint('命中 '+hits+' / 3','good'); if(hits>=3)A.ok('靶道校准完成 · 任务成功'); }
      else { hits=0; hint('脱靶 → 计数清零','bad'); }
    };
    anim=requestAnimationFrame(loop);
  }

  function gMatch(){
    var icons=['◈','◇','▣','▤'], deck=shuffled(icons.concat(icons));
    var grid=el('div','cards'), open=[], lock=false, pairs=0, miss=0;
    deck.forEach(function(ic){
      var c=el('div','cd','·'); c.dataset.ic=ic;
      c.onclick=function(){
        if(done||lock||c.classList.contains('done')||c.classList.contains('up'))return;
        c.classList.add('up'); c.textContent=ic; open.push(c);
        if(open.length<2)return;
        var a=open[0], b=open[1];
        if(a.dataset.ic===b.dataset.ic){
          a.classList.add('done'); b.classList.add('done'); open=[]; pairs++;
          hint('已配对 '+pairs+' / 4');
          if(pairs===4)A.ok('全部接通 · 任务成功');
        }else{
          lock=true; miss++;
          setTimeout(function(){
            if(done)return;
            a.classList.remove('up'); b.classList.remove('up'); a.textContent='·'; b.textContent='·';
            open=[]; lock=false;
            if(miss>=3)A.fail('错配 3 次 → 整组重来');
          },420);
        }
      };
      grid.appendChild(c);
    });
    stage.appendChild(grid); hint('翻两张，图标相同即配对；错配 3 次整组重来','');
  }

  function gLevel(){
    var shelf=el('div','shelf'), line=el('div','tline');
    var target=42; line.style.top=target+'%'; shelf.appendChild(line);
    var bars=[], base=[20,34,58,72];
    base.forEach(function(v,i){
      var b=el('div','lv'), g=el('i',null,'L'+(i+1));
      b.style.top=v+'%'; b.appendChild(g); shelf.appendChild(b); bars.push(b);
    });
    stage.appendChild(shelf); hint('拖动四层货架，全部对齐到虚线（±3%）','');
    var drag=null;
    function pct(e){ var bb=shelf.getBoundingClientRect(); return (e.clientY-bb.top)/bb.height*100; }
    shelf.addEventListener('pointerdown',function(e){
      var t=e.target.closest?e.target.closest('.lv'):null;
      if(!t)return; drag=t; t.setPointerCapture(e.pointerId); e.preventDefault();
    });
    shelf.addEventListener('pointermove',function(e){
      if(!drag)return; drag.style.top=Math.max(0,Math.min(92,pct(e)))+'%'; check();
    });
    shelf.addEventListener('pointerup',function(){ drag=null; });
    shelf.addEventListener('pointercancel',function(){ drag=null; });
    function check(){
      var okAll=bars.every(function(b){ return Math.abs(parseFloat(b.style.top)-target)<=3; });
      if(okAll)A.ok('四层齐平 · 任务成功');
    }
  }

  var BUILD={ wire:gWire, place:gPlace, lever:gLever, sync:gSync, pour:gPour,
              swap:gSwap, align:gAlign, aim:gAim, match:gMatch, level:gLevel };

  function start(i){
    cur=i; done=false; clearStage();
    var t=TASKS[i], c=ART[t.arch];
    stage.style.backgroundImage=c?('linear-gradient(rgba(10,13,19,.72),rgba(10,13,19,.86)),url("'+c+'")'):'none';
    title.textContent=t.room+' · '+t.name+(t.kind==='hard'?'（高难）':'');
    foot.textContent='玩法 '+t.arch+' · 时限 '+t.dur+'s · 中断或失败即重做';
    limit=(t.tier==='circuit'?20:(t.tier==='hard'?16:10)); t0=performance.now();
    clock.textContent='保底 '+limit+'s'; prog.style.width='0%';
    Array.prototype.forEach.call(side.children,function(x){
      if(x.dataset&&x.dataset.i!=null)x.setAttribute('aria-current', String(+x.dataset.i===i));
    });
    if(BUILD[t.arch]){ BUILD[t.arch](); raf=requestAnimationFrame(tick); }
    else hint('该玩法尚未实现');
  }

  var rooms=[];
  TASKS.forEach(function(t){ if(rooms.indexOf(t.room)<0)rooms.push(t.room); });
  rooms.forEach(function(r){
    side.appendChild(el('div','room',r));
    TASKS.forEach(function(t,i){
      if(t.room!==r)return;
      var row=el('div','row'); row.dataset.i=i;
      row.appendChild(el('span','nm',t.name));
      row.appendChild(el('span','tag'+(t.kind==='hard'?' hard':''),t.kind==='hard'?'独特':t.arch));
      row.appendChild(el('span','tm',t.dur+'s'));
      row.onclick=function(){ start(i); };
      side.appendChild(row);
    });
  });

  document.getElementById('abort').onclick=function(){
    if(done)return; done=true; stop(); panel.classList.add('bad');
    hint('中断 → 进度清零，需要重做','bad');
    var b=el('button','btn','重做'); b.style.marginTop='8px'; b.onclick=function(){ start(cur); };
    stage.appendChild(b);
  };
})();
</script>
